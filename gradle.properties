org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx4g
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.code.style=official
kotlin.stdlib.default.dependency=false
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.version=2.3.21

# Kotlin/Native targets to build (klibs + native binaries), comma-separated, from
# macosX64, macosArm64, linuxX64 and mingwX64. Empty by default so local builds
# only compile JVM and JS, which is dramatically faster. `make build` adds the host
# and linuxX64; CI and release jobs pass the targets they need.
wirespec.nativeTargets=

# Uncomment to capture Kotlin compilation timings under build/reports/kotlin-build
#kotlin.build.report.output=file
#kotlin.build.report.file.output_dir=build/reports/kotlin-build
