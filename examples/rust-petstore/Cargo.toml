[package]
name = "wirespec-petstore"
version = "0.1.0"
edition = "2024"

[dependencies]
# Validates refined types; every generated file imports it.
regex = "1"
# Serialization
serde_json = "1"
# Transportation: reqwest for the client, actix-web for the server.
reqwest = "0.12"
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt"] }
